<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Prédictions Coupe du Monde 2026</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body {
        background: #0d1b2a;
        min-height: 100vh;
        padding: 20px;
        color: #fff;
    }
    .container { max-width: 950px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 5px; font-size: 2em; }
    .subtitle { text-align: center; opacity: 0.85; margin-bottom: 25px; }
    .api-config {
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
        padding: 12px 16px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .api-config input {
        flex: 1;
        min-width: 200px;
        padding: 8px 12px;
        border-radius: 6px;
        border: none;
        font-size: 0.9em;
    }
    .group-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 20px;
    }
    .group-tab {
        background: rgba(255,255,255,0.15);
        border: none;
        color: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.15s;
    }
    .group-tab:hover { background: rgba(255,255,255,0.3); }
    .group-tab.active { background: #fdbb2d; color: #1a2a6c; }

    .panel {
        background: rgba(255,255,255,0.1);
        border-radius: 12px;
        padding: 16px 20px;
        margin-bottom: 20px;
    }
    .panel h2 { font-size: 1.1em; margin-bottom: 12px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
    th, td { padding: 6px 8px; text-align: center; white-space: nowrap; }
    th { opacity: 0.8; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.25); }
    td.team-name { text-align: left; display: flex; align-items: center; gap: 8px; }
    tr:nth-child(even) td { background: rgba(255,255,255,0.04); }
    .team-logo { width: 20px; height: 20px; object-fit: contain; }
    .team-flag { display: inline-flex; vertical-align: middle; }

    .recent-result {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        font-size: 0.9em;
        flex-wrap: wrap;
    }
    .recent-result:last-child { border-bottom: none; }
    .no-data { opacity: 0.7; font-style: italic; font-size: 0.9em; }
    .loading-spinner {
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0.8;
        font-size: 0.9em;
        padding: 4px 0;
    }
    .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255,255,255,0.25);
        border-top-color: #fdbb2d;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .live-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: #e74c3c;
        color: white;
        font-size: 0.75em;
        font-weight: bold;
        padding: 2px 8px;
        border-radius: 10px;
        animation: pulse 1.5s infinite;
        vertical-align: middle;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    @keyframes highlight-correct {
        0% { background: rgba(46, 204, 113, 0.6); }
        100% { background: transparent; }
    }
    @keyframes highlight-wrong {
        0% { background: rgba(231, 76, 60, 0.6); }
        100% { background: transparent; }
    }
    .row-correct { animation: highlight-correct 3s ease-out; }
    .row-wrong { animation: highlight-wrong 3s ease-out; }

    .toast-container {
        position: fixed;
        bottom: 16px;
        right: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 1000;
    }
    .toast {
        background: #fdbb2d;
        color: #1a2a6c;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 0.9em;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        animation: toast-in 0.3s ease-out;
        max-width: 280px;
    }
    @keyframes toast-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .match-card {
        background: rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 16px 20px;
        margin-bottom: 12px;
        backdrop-filter: blur(5px);
    }
    .match-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }
    .match-teams { font-size: 1.15em; font-weight: bold; }
    .match-meta { font-size: 0.85em; opacity: 0.8; }
    .predict-btn {
        background: #fdbb2d;
        color: #1a2a6c;
        border: none;
        padding: 8px 18px;
        border-radius: 20px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.15s;
    }
    .predict-btn:hover { transform: scale(1.05); }
    .predict-btn:disabled { opacity: 0.6; cursor: wait; }
    .final-score {
        background: rgba(255,255,255,0.15);
        padding: 8px 18px;
        border-radius: 20px;
        font-weight: bold;
    }
    .result {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid rgba(255,255,255,0.2);
    }
    .bars { display: flex; height: 28px; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
    .bar { display: flex; align-items: center; justify-content: center; font-size: 0.8em; font-weight: bold; transition: width 0.4s; }
    .bar.home { background: #2ecc71; }
    .bar.draw { background: #95a5a6; }
    .bar.away { background: #e74c3c; }
    .result-labels { display: flex; justify-content: space-between; font-size: 0.85em; opacity: 0.85; }
    .h2h { margin-top: 10px; font-size: 0.85em; opacity: 0.9; }
    .h2h-title { font-weight: bold; margin-bottom: 4px; }
    .error { color: #ffd2d2; font-size: 0.9em; margin-top: 8px; }
    .round-title {
        font-size: 1.1em;
        font-weight: bold;
        margin: 25px 0 10px;
        padding-bottom: 5px;
        border-bottom: 2px solid rgba(255,255,255,0.3);
    }

    @media (max-width: 600px) {
        body { padding: 10px; }
        h1 { font-size: 1.4em; }
        .subtitle { font-size: 0.85em; }
        .group-tab { padding: 6px 10px; font-size: 0.85em; }
        .match-teams { font-size: 1em; }
        .panel, .match-card { padding: 12px 14px; }
        th, td { padding: 4px 5px; font-size: 0.85em; }
        .team-logo { width: 16px; height: 16px; }
        .predict-btn { padding: 6px 14px; font-size: 0.9em; }
        .bars { height: 24px; }
    }
</style>
</head>

    <p class="subtitle">Phase de groupes — basé sur la forme récente des sélections nationales</p>

    <div id="matches"></div>
    <div id="extraView" style="display:none;"></div>
</div>
<div class="toast-container" id="toastContainer"></div>

GROUP_NAMES.forEach(g => {
    const btn = document.createElement('button');

        subView = g;
        currentGroup = g;
        localStorage.setItem('wcCurrentGroup', g);
        render();

    groupTabs.appendChild(btn);
});

        mainView = btn.dataset.main;
        render();
    });
});

timeTabs.querySelectorAll('.group-tab').forEach(btn => {
    btn.addEventListener('click', () => {
        subView = btn.dataset.time;
        if (GROUP_NAMES.includes(subView)) localStorage.removeItem('wcCurrentGroup');
        render();

// --- Classement ---
function renderStandings() {
    standingsTitle.textContent = `📊 Classement — Groupe ${currentGroup}`;
    const teams = (liveGroups && liveGroups[currentGroup]) || FIXTURES_DATA.groups[currentGroup];

    let html = `<tr><th></th><th style="text-align:left">Équipe</th><th>J</th><th>G</th><th>N</th><th>P</th><th>BP</th><th>BC</th><th>Pts</th></tr>`;
    teams.forEach((t, i) => {
        html += `<tr>
            <td>${i + 1}</td>
            <td class="team-name"><img class="team-logo" src="${t.logo || ('https://media.api-sports.io/football/teams/' + t.id + '.png')}" alt="">${t.name}</td>
            <td>${t.played}</td>
            <td>${t.win}</td>
            <td>${t.draw}</td>
            <td>${t.lose}</td>
            <td>${t.gf}</td>
            <td>${t.ga}</td>
            <td><strong>${t.points}</strong></td>
        </tr>`;
    });
    standingsTable.innerHTML = html;
}


// --- Carte de match (réutilisée pour groupe et "aujourd'hui") ---
function buildMatchCard(match, showGroup) {
    const idx = FIXTURES_DATA.fixtures.indexOf(match);
    const date = new Date(match.date);
    const dateStr = date.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    const groupLabel = showGroup ? ` <span class="no-data">(Groupe ${match.group})</span>` : '';

    const live = liveMatches[match.id];
    const liveBadge = live ? ` <span class="live-badge">🔴 ${live.home_goals}-${live.away_goals} (${live.elapsed}')</span>` : '';

    const playedResult = (liveResults || []).find(r => r.id === match.id);
    const predictBtn = playedResult
        ? `<span class="final-score">Terminé : ${playedResult.home_goals} - ${playedResult.away_goals}</span>`
        : live
            ? `<span class="final-score">En cours</span>`
            : `<button class="predict-btn" data-idx="${idx}">Prédire</button>`;

    const card = document.createElement('div');
    card.className = 'match-card';
    card.innerHTML = `
        <div class="match-header">
            <div>
                <div class="match-teams"><img class="team-logo" src="${logoFor(match.home_id)}" alt="">${match.home} 🆚 ${match.away}<img class="team-logo" src="${logoFor(match.away_id)}" alt="">${groupLabel}${liveBadge}</div>
                <div class="match-meta">${dateStr} — ${match.venue}</div>
            </div>
            ${predictBtn}
        </div>
        <div class="result" id="result-${idx}" style="display:none;"></div>
    `;

    // Si une prédiction a déjà été calculée pour ce match, on l'affiche directement
    if (!playedResult && !live) {
        const saved = getPredictions()[match.id];
        if (saved) {
            const resultEl = card.querySelector(`#result-${idx}`);
            renderPredictionResult(resultEl, match, saved.home, saved.draw, saved.away, saved.h2h || []);
            const btn = card.querySelector('.predict-btn');
            if (btn) btn.textContent = 'Recalculer';
        }
    }

    return card;
}

// --- Affiche le résultat d'une prédiction (barres + h2h + partage) ---
function renderPredictionResult(resultEl, match, home, draw, away, h2h) {
    let h2hHtml = '';
    if (h2h && h2h.length > 0) {
        h2hHtml = `
            <div class="h2h">
                <div class="h2h-title">🤝 Confrontations précédentes</div>
                ${h2h.map(m => `<div>${m.date} — ${m.home} ${m.home_goals} - ${m.away_goals} ${m.away} (${m.competition})</div>`).join('')}
            </div>
        `;
    } else {
        h2hHtml = `<div class="h2h"><div class="h2h-title">🤝 Confrontations précédentes</div><div class="no-data">Aucune confrontation récente trouvée.</div></div>`;
    }

    resultEl.style.display = 'block';
    resultEl.innerHTML = `
        <div class="bars">
            <div class="bar home" style="width:${home}%">${home >= 8 ? home + '%' : ''}</div>
            <div class="bar draw" style="width:${draw}%">${draw >= 8 ? draw + '%' : ''}</div>
            <div class="bar away" style="width:${away}%">${away >= 8 ? away + '%' : ''}</div>
        </div>
        <div class="result-labels">
            <span>🏠 ${match.home}</span>
            <span>🤝 Nul</span>
            <span>✈️ ${match.away}</span>
        </div>
        ${h2hHtml}
        <button class="predict-btn share-btn" data-share="${match.home} 🆚 ${match.away} : ${home}% / ${draw}% / ${away}% (Nul) — Prédiction Coupe du Monde 2026">📤 Partager ma prédiction</button>
    `;
}

// --- Matchs du groupe ---
function renderMatches() {
    matchesContainer.innerHTML = '';
    const fixtures = FIXTURES_DATA.fixtures.filter(f => f.group === currentGroup);

    let lastRound = null;
    fixtures.forEach((match) => {
        if (match.round !== lastRound) {
            lastRound = match.round;
            const roundEl = document.createElement('div');
            roundEl.className = 'round-title';
            roundEl.textContent = lastRound;
            matchesContainer.appendChild(roundEl);
        }
        matchesContainer.appendChild(buildMatchCard(match, false));
    });
}

function dateOffset(days) {
    const d = new Date();
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);
}

// --- Matchs d'un jour donné (tous groupes confondus) ---
function renderDay(dayOffset, emptyLabel) {
    matchesContainer.innerHTML = '';
    const target = dateOffset(dayOffset);
    const fixtures = FIXTURES_DATA.fixtures.filter(f => f.date.slice(0, 10) === target);

    if (fixtures.length === 0) {
        matchesContainer.innerHTML = `<p class="no-data">${emptyLabel}</p>`;
        return;
    }
    fixtures.forEach(match => matchesContainer.appendChild(buildMatchCard(match, true)));
}

// --- Tous les matchs à venir (non encore joués) ---
function renderUpcoming() {
    matchesContainer.innerHTML = '';
    const playedIds = new Set((liveResults || []).map(r => r.id));
    const fixtures = FIXTURES_DATA.fixtures.filter(f => !playedIds.has(f.id));

    if (fixtures.length === 0) {
        matchesContainer.innerHTML = '<p class="no-data">Tous les matchs de la phase de groupes ont été joués.</p>';
        return;
    }

    let lastDate = null;
    fixtures.forEach(match => {
        const d = match.date.slice(0, 10);
        if (d !== lastDate) {
            lastDate = d;
            const dateEl = document.createElement('div');
            dateEl.className = 'round-title';
            dateEl.textContent = new Date(match.date).toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long' });
            matchesContainer.appendChild(dateEl);
        }
        matchesContainer.appendChild(buildMatchCard(match, true));
    });
}

// --- Favoris ---
function getFavorites() {
    return JSON.parse(localStorage.getItem('wcFavorites') || '[]');
}

function toggleFavorite(teamId) {
    let favs = getFavorites();
    if (favs.includes(teamId)) favs = favs.filter(id => id !== teamId);
    else favs.push(teamId);
    localStorage.setItem('wcFavorites', JSON.stringify(favs));
    renderFavorites();
}

function renderFavorites() {
    const favs = getFavorites();
    const playedIds = new Set((liveResults || []).map(r => r.id));

    let html = '<div class="panel"><h2>⭐ Choisis tes équipes favorites</h2><div class="group-tabs">';
    Object.entries(FIXTURES_DATA.teams).forEach(([id, name]) => {
        const teamId = parseInt(id);
        const active = favs.includes(teamId) ? ' active' : '';
        html += `<button class="group-tab favorite-toggle${active}" data-team="${teamId}"><img class="team-logo" src="${logoFor(teamId)}" alt="">${name}</button>`;
    });
    html += '</div></div>';

    if (favs.length > 0) {
        const fixtures = FIXTURES_DATA.fixtures.filter(f => (favs.includes(f.home_id) || favs.includes(f.away_id)) && !playedIds.has(f.id));
        html += '<div id="favoriteMatches"></div>';
        extraView.innerHTML = html;

        const container = document.getElementById('favoriteMatches');
        if (fixtures.length === 0) {
            container.innerHTML = '<p class="no-data">Aucun match à venir pour tes équipes favorites.</p>';
        } else {
            fixtures.forEach(match => container.appendChild(buildMatchCard(match, true)));
        }
    } else {
        html += '<p class="no-data">Sélectionne une ou plusieurs équipes pour voir leurs prochains matchs.</p>';
        extraView.innerHTML = html;
    }

    extraView.querySelectorAll('.favorite-toggle').forEach(btn => {
        btn.addEventListener('click', () => toggleFavorite(parseInt(btn.dataset.team)));
    });
}

// --- Phases finales ---
function renderKnockout(timeView) {
    if (!liveKnockout) {
        extraView.innerHTML = '<p class="no-data">Les phases à élimination directe seront disponibles une fois les données chargées.</p>';
        return;
    }
    if (liveKnockout.length === 0) {
        extraView.innerHTML = '<p class="no-data">Les phases à élimination directe ne sont pas encore programmées.</p>';
        return;
    }

    let matches;
    let emptyMessage;
    if (timeView === 'today' || timeView === 'tomorrow' || timeView === 'dayafter') {
        const offset = timeView === 'today' ? 0 : (timeView === 'tomorrow' ? 1 : 2);
        const target = dateOffset(offset);
        matches = liveKnockout.filter(m => m.date.slice(0, 10) === target);
        emptyMessage = {
            today: "Aucun match de phase finale prévu aujourd'hui.",
            tomorrow: 'Aucun match de phase finale prévu demain.',
            dayafter: 'Aucun match de phase finale prévu après-demain.'
        }[timeView];
    } else {
        matches = liveKnockout.filter(m => !['FT', 'AET', 'PEN'].includes(m.status));
        emptyMessage = 'Aucun match de phase finale à venir pour le moment.';
    }

    if (matches.length === 0) {
        extraView.innerHTML = `<p class="no-data">${emptyMessage}</p>`;
        return;
    }

    let html = '';
    let lastRound = null;
    matches.forEach(m => {
        if (m.round !== lastRound) {
            lastRound = m.round;
            html += `<div class="round-title">${lastRound}</div>`;
        }
        const date = new Date(m.date);
        const dateStr = date.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        const score = (m.home_goals !== null && m.away_goals !== null)
            ? `<strong>${m.home_goals} - ${m.away_goals}</strong>`
            : '🆚';
        html += `
            <div class="match-card">
                <div class="match-header">
                    <div>
                        <div class="match-teams">${m.home} ${score} ${m.away}</div>
                        <div class="match-meta">${dateStr} — ${m.venue || ''}</div>
                    </div>
                </div>
            </div>
        `;
    });
    extraView.innerHTML = html;
}

// --- Mes pronostics ---
function renderMyPredictions() {
    const preds = getPredictions();
    const entries = Object.entries(preds);

    if (entries.length === 0) {
        extraView.innerHTML = '<p class="no-data">Tu n\'as encore fait aucun pronostic. Va dans un groupe et clique sur "Prédire" !</p>';
        return;
    }

    const statusLabel = { home: 'Victoire ' , draw: 'Match nul', away: 'Victoire ' };

    let html = '<div class="table-wrap"><table><tr><th style="text-align:left">Match</th><th>Pronostic</th><th>Résultat</th><th></th></tr>';
    entries.slice().reverse().forEach(([matchId, p]) => {
        const predictedText = p.predicted === 'draw' ? 'Match nul' : (p.predicted === 'home' ? p.homeTeam : p.awayTeam);
        let statusIcon = '⏳';
        let rowClass = '';
        if (p.evaluated) {
            const correct = p.predicted === p.actual;
            statusIcon = correct ? '✅' : '❌';
            if (p.justEvaluated) rowClass = correct ? ' class="row-correct"' : ' class="row-wrong"';
        }
        html += `<tr${rowClass}>
            <td style="text-align:left">${p.homeTeam} 🆚 ${p.awayTeam}</td>
            <td>${predictedText} (${p.home}% / ${p.draw}% / ${p.away}%)</td>
            <td>${p.evaluated ? (p.actual === 'draw' ? 'Match nul' : (p.actual === 'home' ? p.homeTeam + ' gagne' : p.awayTeam + ' gagne')) : 'À venir'}</td>
            <td>${statusIcon}</td>
        </tr>`;
    });
    html += '</table></div>';
    extraView.innerHTML = html;
}

function renderGroup() {
    renderStandings();
    renderMatches();
}

// --- Affichage selon la vue active ---
function render() {
    // Onglets principaux
    mainTabs.querySelectorAll('.group-tab').forEach(b => b.classList.toggle('active', b.dataset.main === mainView));

    // Onglets temporels et de groupes
    timeTabs.querySelectorAll('.group-tab').forEach(b => b.classList.toggle('active', b.dataset.time === subView));
    groupTabs.querySelectorAll('.group-tab').forEach(b => b.classList.toggle('active', b.dataset.group === subView));

    if (mainView === 'groups') {
        timeTabs.style.display = '';
        groupTabs.style.display = '';

        if (GROUP_NAMES.includes(subView)) {
            currentGroup = subView;
            standingsPanel.style.display = '';
            recentResultsPanel.style.display = '';
            matchesContainer.style.display = '';
            extraView.style.display = 'none';
            renderGroup();
        } else {
            standingsPanel.style.display = 'none';
            recentResultsPanel.style.display = 'none';
            matchesContainer.style.display = '';
            extraView.style.display = 'none';
            if (subView === 'upcoming') renderUpcoming();
            else if (subView === 'today') renderDay(0, "Aucun match prévu aujourd'hui.");
            else if (subView === 'tomorrow') renderDay(1, 'Aucun match prévu demain.');
            else renderDay(2, 'Aucun match prévu après-demain.');
        }
    } else if (mainView === 'knockout') {
        timeTabs.style.display = '';
        groupTabs.style.display = 'none';
        standingsPanel.style.display = 'none';
        recentResultsPanel.style.display = 'none';
        matchesContainer.style.display = 'none';
        matchesContainer.innerHTML = '';
        extraView.style.display = '';
        renderKnockout(GROUP_NAMES.includes(subView) ? 'upcoming' : subView);
    } else {
        timeTabs.style.display = 'none';
        groupTabs.style.display = 'none';
        standingsPanel.style.display = 'none';
        recentResultsPanel.style.display = 'none';
        matchesContainer.style.display = 'none';
        matchesContainer.innerHTML = '';
        extraView.style.display = '';
        if (mainView === 'favorites') renderFavorites();
        else renderMyPredictions();
    }
}

// --- Cache local des données live (5 minutes) ---
const CACHE_TTL = 5 * 60 * 1000;

async function fetchWithCache(endpoint, key) {
    const cached = JSON.parse(localStorage.getItem(key) || 'null');
    if (cached && (Date.now() - cached.timestamp) < CACHE_TTL) {
        return cached.data;
    }
    const res = await fetch(`${apiUrl()}${endpoint}`);
    if (!res.ok) throw new Error(`Erreur API (${res.status})`);
    const data = await res.json();
    localStorage.setItem(key, JSON.stringify({ timestamp: Date.now(), data }));
    return data;
}

// --- Chargement des données live ---
async function loadLiveData() {
    try {
        const [groupsData, resultsData, knockoutData] = await Promise.all([
            fetchWithCache('/wc_groups', 'wcCacheGroups'),
            fetchWithCache('/wc_results', 'wcCacheResults'),
            fetchWithCache('/wc_knockout', 'wcCacheKnockout')
        ]);
        liveGroups = groupsData.groups;
        liveResults = resultsData.results;
        liveKnockout = knockoutData.knockout;
    } catch (err) {
        console.warn('Impossible de charger les données live, utilisation des données statiques.', err);
    }
    document.getElementById('loadingSpinner').style.display = 'none';
    render();
    evaluatePredictions();
}

// --- Matchs en direct (rafraîchi automatiquement) ---
async function pollLiveMatches() {
    try {
        const res = await fetch(`${apiUrl()}/wc_live`);
        if (!res.ok) return;
        const data = await res.json();
        const newLive = {};
        (data.live || []).forEach(m => { newLive[m.id] = m; });

        const wasLive = Object.keys(liveMatches).length > 0;
        liveMatches = newLive;
        const isLive = Object.keys(liveMatches).length > 0;

        // Re-render si l'état "live" a changé ou si un score live a évolué
        render();

        // Si un match vient de se terminer, on recharge les résultats/classements
        if (wasLive && !isLive) {
            ['wcCacheGroups', 'wcCacheResults', 'wcCacheKnockout'].forEach(k => localStorage.removeItem(k));
            loadLiveData();
        }
    } catch (err) {
        // silencieux : le direct n'est pas critique
    }
}

// --- Mémoire des prédictions & indice de confiance ---
function getPredictions() {
    return JSON.parse(localStorage.getItem('wcPredictions') || '{}');
}

function savePrediction(matchId, home, draw, away, homeTeam, awayTeam, h2h) {
    const preds = getPredictions();
    let predicted;
    if (home >= draw && home >= away) predicted = 'home';
    else if (away >= draw && away >= home) predicted = 'away';
    else predicted = 'draw';
    const existing = preds[matchId] || {};
    preds[matchId] = { ...existing, home, draw, away, predicted, homeTeam, awayTeam, h2h, evaluated: existing.evaluated || false };
    localStorage.setItem('wcPredictions', JSON.stringify(preds));
}

function getConfidenceStats() {
    return JSON.parse(localStorage.getItem('wcConfidenceStats') || '{"correct":0,"total":0}');
}

function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    document.getElementById('toastContainer').appendChild(toast);
    setTimeout(() => toast.remove(), 6000);
}

function evaluatePredictions() {
    if (!liveResults) return;
    const preds = getPredictions();
    const stats = getConfidenceStats();
    let changed = false;

    liveResults.forEach(r => {
        const p = preds[r.id];
        if (p && !p.evaluated) {
            let actual;
            if (r.home_goals > r.away_goals) actual = 'home';
            else if (r.away_goals > r.home_goals) actual = 'away';
            else actual = 'draw';

            stats.total++;
            const correct = p.predicted === actual;
            if (correct) stats.correct++;
            p.evaluated = true;
            p.actual = actual;
            p.justEvaluated = true;
            changed = true;

            showToast(`${correct ? '✅' : '❌'} ${p.homeTeam} 🆚 ${p.awayTeam} : pronostic ${correct ? 'correct' : 'incorrect'} !`);
        }
    });

    if (changed) {
        localStorage.setItem('wcPredictions', JSON.stringify(preds));
        localStorage.setItem('wcConfidenceStats', JSON.stringify(stats));
        if (mainView === 'mine') renderMyPredictions();

        // Retire le marqueur "justEvaluated" après l'affichage de l'animation
        setTimeout(() => {
            const p2 = getPredictions();
            Object.values(p2).forEach(p => delete p.justEvaluated);
            localStorage.setItem('wcPredictions', JSON.stringify(p2));
        }, 3500);
    }
    renderConfidence(stats);
}

function renderConfidence(stats) {
    const el = document.getElementById('confidenceIndicator');
    if (!stats || stats.total === 0) {
        el.textContent = '🎯 Indice de confiance : pas encore de pronostics vérifiés.';
        return;
    }
    const pct = Math.round(stats.correct / stats.total * 100);
    el.textContent = `🎯 Indice de confiance du site : ${pct}% (${stats.correct}/${stats.total} pronostics corrects)`;
}

// --- Prédiction d'un match ---
async function handleResultClick(e) {
    if (e.target.classList.contains('share-btn')) {
        const text = e.target.dataset.share;
        try {
            await navigator.clipboard.writeText(text);
            const original = e.target.textContent;
            e.target.textContent = '✅ Copié !';
            setTimeout(() => { e.target.textContent = original; }, 1500);
        } catch (err) {
            alert(text);
        }
        return;
    }
    if (!e.target.classList.contains('predict-btn')) return;

    const idx = e.target.dataset.idx;
    const match = FIXTURES_DATA.fixtures[idx];
    const resultEl = document.getElementById(`result-${idx}`);

    e.target.disabled = true;
    e.target.textContent = 'Calcul...';
    resultEl.style.display = 'block';
    resultEl.innerHTML = '<p>⏳ Récupération des données...</p>';

    try {
        const response = await fetch(`${apiUrl()}/predict_wc`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                home_team_id: match.home_id,
                away_team_id: match.away_id
            })
        });

        if (!response.ok) throw new Error(`Erreur API (${response.status})`);

        const data = await response.json();
        const home = Math.round(data.homeWin);
        const draw = Math.round(data.draw);
        const away = Math.round(data.awayWin);

        savePrediction(match.id, home, draw, away, match.home, match.away, data.h2h || []);
        renderPredictionResult(resultEl, match, home, draw, away, data.h2h || []);
    } catch (err) {
        resultEl.innerHTML = `<p class="error">❌ ${err.message}. Vérifiez que l'API tourne sur l'URL configurée.</p>`;
    } finally {
        e.target.disabled = false;
        e.target.textContent = 'Prédire';
    }
}

matchesContainer.addEventListener('click', handleResultClick);
extraView.addEventListener('click', handleResultClick);

render();
renderConfidence(getConfidenceStats());
loadLiveData();

// Vérifie les matchs en direct toutes les 30 secondes (sans recharger la page)
setInterval(pollLiveMatches, 30000);
pollLiveMatches();
</script>
