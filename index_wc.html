<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Prédictions Coupe du Monde 2026</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body {
        background: #0d1b2a;
        min-height: 100vh;
        padding: 20px;
        color: #fff;
    }
    .container { max-width: 950px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 5px; font-size: 2em; }
    .subtitle { text-align: center; opacity: 0.85; margin-bottom: 25px; }
    .api-config {
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
        padding: 12px 16px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .api-config input {
        flex: 1;
        min-width: 200px;
        padding: 8px 12px;
        border-radius: 6px;
        border: none;
        font-size: 0.9em;
    }
    .group-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 20px;
    }
    .group-tab {
        background: rgba(255,255,255,0.15);
        border: none;
        color: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.15s;
    }
    .group-tab:hover { background: rgba(255,255,255,0.3); }
    .group-tab.active { background: #fdbb2d; color: #1a2a6c; }

    .panel {
        background: rgba(255,255,255,0.1);
        border-radius: 12px;
        padding: 16px 20px;
        margin-bottom: 20px;
    }
    .panel h2 { font-size: 1.1em; margin-bottom: 12px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
    th, td { padding: 6px 8px; text-align: center; white-space: nowrap; }
    th { opacity: 0.8; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.25); }
    td.team-name { text-align: left; display: flex; align-items: center; gap: 8px; }
    tr:nth-child(even) td { background: rgba(255,255,255,0.04); }
    .team-logo { width: 20px; height: 20px; object-fit: contain; }
    .team-flag { display: inline-flex; vertical-align: middle; }

    .recent-result {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        font-size: 0.9em;
        flex-wrap: wrap;
    }
    .recent-result:last-child { border-bottom: none; }
    .no-data { opacity: 0.7; font-style: italic; font-size: 0.9em; }
    .loading-spinner {
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0.8;
        font-size: 0.9em;
        padding: 4px 0;
    }
    .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255,255,255,0.25);
        border-top-color: #fdbb2d;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .match-card {
        background: rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 16px 20px;
        margin-bottom: 12px;
        backdrop-filter: blur(5px);
    }
    .match-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }
    .match-teams { font-size: 1.15em; font-weight: bold; }
    .match-meta { font-size: 0.85em; opacity: 0.8; }
    .predict-btn {
        background: #fdbb2d;
        color: #1a2a6c;
        border: none;
        padding: 8px 18px;
        border-radius: 20px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.15s;
    }
    .predict-btn:hover { transform: scale(1.05); }
    .predict-btn:disabled { opacity: 0.6; cursor: wait; }
    .result {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid rgba(255,255,255,0.2);
    }
    .bars { display: flex; height: 28px; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
    .bar { display: flex; align-items: center; justify-content: center; font-size: 0.8em; font-weight: bold; transition: width 0.4s; }
    .bar.home { background: #2ecc71; }
    .bar.draw { background: #95a5a6; }
    .bar.away { background: #e74c3c; }
    .result-labels { display: flex; justify-content: space-between; font-size: 0.85em; opacity: 0.85; }
    .h2h { margin-top: 10px; font-size: 0.85em; opacity: 0.9; }
    .h2h-title { font-weight: bold; margin-bottom: 4px; }
    .error { color: #ffd2d2; font-size: 0.9em; margin-top: 8px; }
    .round-title {
        font-size: 1.1em;
        font-weight: bold;
        margin: 25px 0 10px;
        padding-bottom: 5px;
        border-bottom: 2px solid rgba(255,255,255,0.3);
    }

    @media (max-width: 600px) {
        body { padding: 10px; }
        h1 { font-size: 1.4em; }
        .subtitle { font-size: 0.85em; }
        .group-tab { padding: 6px 10px; font-size: 0.85em; }
        .match-teams { font-size: 1em; }
        .panel, .match-card { padding: 12px 14px; }
        th, td { padding: 4px 5px; font-size: 0.85em; }
        .team-logo { width: 16px; height: 16px; }
        .predict-btn { padding: 6px 14px; font-size: 0.9em; }
        .bars { height: 24px; }
    }
</style>
</head>

const GROUP_NAMES = Object.keys(FIXTURES_DATA.groups).sort();

let currentGroup = (localStorage.getItem('wcCurrentGroup') && GROUP_NAMES.includes(localStorage.getItem('wcCurrentGroup')))
    ? localStorage.getItem('wcCurrentGroup')
    : GROUP_NAMES[0];
let liveGroups = null;
let liveResults = null;

const apiUrlInput = document.getElementById('apiUrl');
const groupTabs = document.getElementById('groupTabs');
const standingsTitle = document.getElementById('standingsTitle');
const standingsTable = document.getElementById('standingsTable');
const recentResultsEl = document.getElementById('recentResults');
const matchesContainer = document.getElementById('matches');

function apiUrl() {
    return apiUrlInput.value.replace(/\/$/, '');
}

function logoFor(teamId) {
    return `https://media.api-sports.io/football/teams/${teamId}.png`;
}

// --- Onglets de groupes ---
GROUP_NAMES.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'group-tab' + (g === currentGroup ? ' active' : '');
    btn.textContent = 'Groupe ' + g;
    btn.dataset.group = g;
    btn.addEventListener('click', () => {
        currentGroup = g;
        localStorage.setItem('wcCurrentGroup', g);
        document.querySelectorAll('.group-tab').forEach(b => b.classList.toggle('active', b.dataset.group === g));
        renderGroup();
    });
    groupTabs.appendChild(btn);
});

// --- Classement ---
function renderStandings() {
    standingsTitle.textContent = `📊 Classement — Groupe ${currentGroup}`;
    const teams = (liveGroups && liveGroups[currentGroup]) || FIXTURES_DATA.groups[currentGroup];

    let html = `<tr><th></th><th style="text-align:left">Équipe</th><th>J</th><th>G</th><th>N</th><th>P</th><th>BP</th><th>BC</th><th>Pts</th></tr>`;
    teams.forEach((t, i) => {
        html += `<tr>
            <td>${i + 1}</td>
            <td class="team-name"><img class="team-logo" src="${t.logo || ('https://media.api-sports.io/football/teams/' + t.id + '.png')}" alt="">${t.name}</td>
            <td>${t.played}</td>
            <td>${t.win}</td>
            <td>${t.draw}</td>
            <td>${t.lose}</td>
            <td>${t.gf}</td>
            <td>${t.ga}</td>
            <td><strong>${t.points}</strong></td>
        </tr>`;
    });
    standingsTable.innerHTML = html;
}

// --- Derniers résultats du groupe ---
function renderRecentResults() {
    const teamIds = new Set(FIXTURES_DATA.groups[currentGroup].map(t => t.id));
    const results = (liveResults || []).filter(r => teamIds.has(r.home_id) && teamIds.has(r.away_id));

    if (results.length === 0) {
        recentResultsEl.innerHTML = '<p class="no-data">Aucun match joué pour le moment.</p>';
        return;
    }

    recentResultsEl.innerHTML = results.map(r => `
        <div class="recent-result">
            <span class="team-name"><img class="team-logo" src="${logoFor(r.home_id)}" alt="">${r.home} ${r.home_goals} - ${r.away_goals} ${r.away}<img class="team-logo" src="${logoFor(r.away_id)}" alt=""></span>
            <span>${r.date}</span>
        </div>
    `).join('');
}

// --- Matchs du groupe ---
function renderMatches() {
    matchesContainer.innerHTML = '';
    const fixtures = FIXTURES_DATA.fixtures.filter(f => f.group === currentGroup);

    let lastRound = null;
    fixtures.forEach((match) => {
        const idx = FIXTURES_DATA.fixtures.indexOf(match);
        if (match.round !== lastRound) {
            lastRound = match.round;
            const roundEl = document.createElement('div');
            roundEl.className = 'round-title';
            roundEl.textContent = lastRound;
            matchesContainer.appendChild(roundEl);
        }

        const date = new Date(match.date);
        const dateStr = date.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

        const card = document.createElement('div');
        card.className = 'match-card';
        card.innerHTML = `
            <div class="match-header">
                <div>
                    <div class="match-teams"><img class="team-logo" src="${logoFor(match.home_id)}" alt="">${match.home} 🆚 ${match.away}<img class="team-logo" src="${logoFor(match.away_id)}" alt=""></div>
                    <div class="match-meta">${dateStr} — ${match.venue}</div>
                </div>
                <button class="predict-btn" data-idx="${idx}">Prédire</button>
            </div>
            <div class="result" id="result-${idx}" style="display:none;"></div>
        `;
        matchesContainer.appendChild(card);
    });
}

function renderGroup() {
    renderStandings();
    renderRecentResults();
    renderMatches();
}

// --- Chargement des données live ---
async function loadLiveData() {
    try {
        const [groupsRes, resultsRes] = await Promise.all([
            fetch(`${apiUrl()}/wc_groups`),
            fetch(`${apiUrl()}/wc_results`)
        ]);
        if (groupsRes.ok) {
            const data = await groupsRes.json();
            liveGroups = data.groups;
        }
        if (resultsRes.ok) {
            const data = await resultsRes.json();
            liveResults = data.results;
        }
    } catch (err) {
        console.warn('Impossible de charger les données live, utilisation des données statiques.', err);
    }
    document.getElementById('loadingSpinner').style.display = 'none';
    renderGroup();
}

// --- Prédiction d'un match ---
matchesContainer.addEventListener('click', async (e) => {
    if (!e.target.classList.contains('predict-btn')) return;

    const idx = e.target.dataset.idx;
    const match = FIXTURES_DATA.fixtures[idx];
    const resultEl = document.getElementById(`result-${idx}`);

    e.target.disabled = true;
    e.target.textContent = 'Calcul...';
    resultEl.style.display = 'block';
    resultEl.innerHTML = '<p>⏳ Récupération des données...</p>';

    try {
        const response = await fetch(`${apiUrl()}/predict_wc`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                home_team_id: match.home_id,
                away_team_id: match.away_id
            })
        });

        if (!response.ok) throw new Error(`Erreur API (${response.status})`);

        const data = await response.json();
        const home = Math.round(data.homeWin);
        const draw = Math.round(data.draw);
        const away = Math.round(data.awayWin);

        let h2hHtml = '';
        if (data.h2h && data.h2h.length > 0) {
            h2hHtml = `
                <div class="h2h">
                    <div class="h2h-title">🤝 Confrontations précédentes</div>
                    ${data.h2h.map(m => `<div>${m.date} — ${m.home} ${m.home_goals} - ${m.away_goals} ${m.away} (${m.competition})</div>`).join('')}
                </div>
            `;
        } else {
            h2hHtml = `<div class="h2h"><div class="h2h-title">🤝 Confrontations précédentes</div><div class="no-data">Aucune confrontation récente trouvée.</div></div>`;
        }

        resultEl.innerHTML = `
            <div class="bars">
                <div class="bar home" style="width:${home}%">${home >= 8 ? home + '%' : ''}</div>
                <div class="bar draw" style="width:${draw}%">${draw >= 8 ? draw + '%' : ''}</div>
                <div class="bar away" style="width:${away}%">${away >= 8 ? away + '%' : ''}</div>
            </div>
            <div class="result-labels">
                <span>🏠 ${match.home}</span>
                <span>🤝 Nul</span>
                <span>✈️ ${match.away}</span>
            </div>
            ${h2hHtml}
        `;
    } catch (err) {
        resultEl.innerHTML = `<p class="error">❌ ${err.message}. Vérifiez que l'API tourne sur l'URL configurée.</p>`;
    } finally {
        e.target.disabled = false;
        e.target.textContent = 'Prédire';
    }
});

apiUrlInput.addEventListener('change', loadLiveData);

renderGroup();
loadLiveData();
</script>
</body>
</html>
